      var v = (

      // Strip surrounding quotes that SCSS string interpolation adds
      return v.replace(/^["']|["']$/g, "");
    }

    function readCssVarInt(name, defaultValue) {
      var v = (
        getComputedStyle(document.documentElement).getPropertyValue(name) || ""
      ).trim();
      var n = parseInt(v, 10);
      return isNaN(n) ? defaultValue : n;
    }

    // ─── Server-side dismissal (logged-in member + field configured)
    // PUT /u/<username>.json with user_fields[<id>]=1 (form-urlencoded).
    // Best-effort: never throws, logs failures.

    function persistMemberDismissal(username, fieldId, csrfToken) {
      if (!username || !fieldId) return;
      var body = "user_fields%5B" + fieldId + "%5D=1";
      fetch("/u/" + encodeURIComponent(username) + ".json", {
        method: "PUT",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded",
          "X-CSRF-Token": csrfToken || "",
        },
        body: body,
      })
        .then(function (res) {
          if (!res.ok) {
            console.warn(
              "[yodev-beta-offer] dismissal PUT returned " + res.status +
              " — falling back to localStorage only"
            );
          } else {
            console.log("[yodev-beta-offer] member dismissal persisted server-side");
          }
        })
        .catch(function (e) {
          console.warn("[yodev-beta-offer] dismissal PUT failed:", e);
        });
    }

    // ─── Banner DOM builder

    // Build the sub line with the brand tokens (worX / Workplace) accented,
    // using DOM nodes (never innerHTML) so it's injection-safe across locales.
    function buildSubWithBrands(textStr) {
      var frag = document.createDocumentFragment();
      var pieces = String(textStr).split(/(worX|Workplace)/);
      for (var i = 0; i < pieces.length; i++) {
        if (pieces[i] === "worX" || pieces[i] === "Workplace") {
          var b = document.createElement("b");
          b.textContent = pieces[i];
          frag.appendChild(b);
        } else if (pieces[i]) {
          frag.appendChild(document.createTextNode(pieces[i]));
        }
      }
      return frag;
    }

    function buildBanner(parts, ctaHref, onDismiss) {
      // Promotional card: accent eyebrow + bright headline, a muted detail line,
      // then a gradient CTA. Glass surface with an atmospheric glow. Reflows on the
      // card's OWN width via a container query (it lives in #main-outlet, not
      // full-width) — the CTA goes full-width when the column is narrow.
      var banner = document.createElement("div");
      banner.className =
        "yodev-beta-banner" + (parts.member ? " yodev-beta-banner--member" : "");

      // Dismiss — anchored top-right of the card
      var dismiss = document.createElement("button");
      dismiss.className = "yodev-beta-banner__dismiss";
      dismiss.setAttribute("aria-label", "Dismiss");
      dismiss.innerHTML = "&times;";
      dismiss.addEventListener("click", onDismiss, { once: true });

      var content = document.createElement("div");
      content.className = "yodev-beta-banner__content";

      var lead = document.createElement("div");
      lead.className = "yodev-beta-banner__lead";

      var eyebrow = document.createElement("span");
      eyebrow.className = "yodev-beta-banner__eyebrow";
      eyebrow.textContent = parts.tag;

      // <div>, NOT <h2>: Discourse themes style headings, and an h2 rule was
      // observed washing the headline to muted/uppercase. A div + own class avoids it.
      var headline = document.createElement("div");
      headline.className = "yodev-beta-banner__headline";
      headline.textContent = parts.headline;

      lead.appendChild(eyebrow);
      lead.appendChild(headline);

      var sub = document.createElement("p");
      sub.className = "yodev-beta-banner__sub";
      sub.appendChild(buildSubWithBrands(parts.sub));

      // CTA(s) — first-party app URLs, same tab. Primary = the offer / app entry;
      // the secondary "Learn more" drives homepage click-throughs for visitors who
      // arrived on Discourse cold and don't yet know the platform. Shown to everyone
      // (anon AND logged-in members — a member landing here has no offer context
      // either), and it softens the "am I being sent to a signup form?" read.
      var ctas = document.createElement("div");
      ctas.className = "yodev-beta-banner__ctas";

      var cta = document.createElement("a");
      cta.className = "yodev-beta-banner__cta";
      cta.href = ctaHref;
      var ctaLabel = document.createElement("span");
      ctaLabel.textContent = parts.cta;
      var arrow = document.createElement("span");
      arrow.className = "yodev-beta-banner__arrow";
      arrow.setAttribute("aria-hidden", "true");
      arrow.textContent = "→";
      cta.appendChild(ctaLabel);
      cta.appendChild(arrow);
      ctas.appendChild(cta);

      if (parts.learnMore) {
        var cta2 = document.createElement("a");
        cta2.className = "yodev-beta-banner__cta2";
        cta2.href = parts.learnMoreHref || ctaHref;
        cta2.textContent = parts.learnMore;
        ctas.appendChild(cta2);
      }

      content.appendChild(lead);
      content.appendChild(sub);
      content.appendChild(ctas);

      banner.appendChild(dismiss);
      banner.appendChild(content);
      return banner;
    }

      panel.appendChild(tag);
      panel.appendChild(title);
      panel.appendChild(body);
      return panel;

    function svgIcon(paths, size) {

      svg.setAttribute("width", size || 20);

      svg.setAttribute("aria-hidden", "true");
      svg.setAttribute("focusable", "false");
      paths.forEach(function (d) {

        p.setAttribute("d", d);

    // Same six hues, same 10% fill / 22% border tint, same 2200ms interval.
    // Only ONE word is ever in the DOM (the homepage explains why: a reader or
    // screen reader must see "…devs: Plan", not all six verbs). Reduced motion
    // leaves the first word, statically.
    var PILL_HUES = ["#5b9df9", "#e2a445", "#3fc98a", "#ec8fa6", "#35c3d6", "#b18ee0"];
    var PILL_INTERVAL_MS = 2200;

    function hueTint(hex, alpha) {
      var n = parseInt(hex.slice(1), 16);
      return "rgba(" + ((n >> 16) & 255) + ", " + ((n >> 8) & 255) + ", " + (n & 255) + ", " + alpha + ")";
    }

    function buildRotatingPill(words) {
      var wrap = el("span", "pill");
      if (!words || !words.length) return wrap;
      var index = 0;
      var current = null;

      function render() {
        var hue = PILL_HUES[index % PILL_HUES.length];
        var w = el("span", "pill-word", words[index % words.length]);
        w.style.color = hue;
        w.style.background = hueTint(hue, 0.1);
        w.style.border = "1px solid " + hueTint(hue, 0.22);
        // Replaced, not mutated, so the fade-in animation replays each time.
        if (current) wrap.replaceChild(w, current);
        else wrap.appendChild(w);
        current = w;
      }
      render();

      if (words.length > 1 && !prefersReducedMotion()) {
        var seen = false;
        var id = setInterval(function () {
          var inDom = document.documentElement.contains(wrap);
          if (!inDom) {
            // Built but not inserted yet: wait. Inserted then removed (the
            // splash was dismissed): stop for good.
            if (seen) clearInterval(id);
            return;
          }
          seen = true;
          index = (index + 1) % words.length;
          render();
        }, PILL_INTERVAL_MS);
      }
      return wrap;
    }

    // Product screenshot. `chrome` adds the homepage's browser-bar dots (the
    // Workplace marquee); `fade` masks the bottom out instead (the worX
    // marquee, whose screenshot carries its own app chrome) — MarqueeRow's
    // two modes.
    function buildShot(imgSrc, alt, opts) {
      opts = opts || {};
      var wrap = el("div", "shot" + (opts.fade ? " yodev-beta-splash__shot--fade" : ""));
      var frame = el("div", "shot-frame");
      if (opts.chrome) {
        var bar = el("div", "shot-bar");
        bar.setAttribute("aria-hidden", "true");
        ["d1", "d2", "d3"].forEach(function (c) {
          bar.appendChild(el("span", "shot-dot yodev-beta-splash__shot-dot--" + c));
        });
        frame.appendChild(bar);
      }
      var img = el("img", "shot-img");
      img.src = imgSrc;
      img.alt = alt;
      img.loading = "lazy";
      img.decoding = "async";
      img.setAttribute("referrerpolicy", "no-referrer");
      frame.appendChild(img);
      wrap.appendChild(frame);
      return wrap;
    }

    function makeCta(label, href, extraClass, onDismiss) {
      var a = document.createElement("a");
      a.className = "yodev-beta-splash__cta" + (extraClass ? " " + extraClass : "");
      a.href = href;
      a.textContent = label;
      a.addEventListener("click", onDismiss, { once: true });
      return a;
    }

    // The way out that stays on the page. A <button>, not a link: it
    // dismisses and stays put.
    function makeContinueButton(label, extraClass, onDismiss) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = extraClass;
      b.textContent = label;
      b.addEventListener("click", onDismiss, { once: true });
      return b;
    }

    // ── 1. Header — the homepage hero (HeroSection.tsx), minus its CTA.
    function buildHeader(home) {
      var hero = el("div", "hero");
      // <h2>, not <h1>: the page under the overlay already has its own h1.
      var h = el("h2", "headline");
      h.appendChild(el("span", "brand", "yoDEV"));
      // Load-bearing space between the two block spans (see HeroSection.tsx,
      // YOD-438): without it the heading's text reads "yoDEVDonde…".
      h.appendChild(document.createTextNode(" "));
      var hook = el("span", "hook");
      hook.appendChild(document.createTextNode(home.hookPre));
      hook.appendChild(el("em", "accent", home.hookAccent));
      hook.appendChild(document.createTextNode(home.hookPost));
      h.appendChild(hook);
      hero.appendChild(h);

      var products = el("p", "products");
      products.appendChild(document.createTextNode(home.titleA + " "));
      products.appendChild(el("span", "plus", home.plus));
      products.appendChild(document.createTextNode(" " + home.titleB));
      hero.appendChild(products);

      hero.appendChild(el("p", "sub", home.heroSub));
      // Same two lines as the homepage hero (Greg, 2026-09-23).
      var plan = el("div", "heroplan");
      plan.appendChild(el("p", "heroplan1", home.planLine1));
      plan.appendChild(el("p", "heroplan2", home.planLine2));
      hero.appendChild(plan);
      return hero;
    }

    // ── 2. CTA row — in, learn more, or out.
    //
    // YOD-516: the way OUT sits next to the two ways in. A search visitor who
    // landed on one article must not have to scroll the whole splash to find a
    // named exit. Deliberately neutral rather than indigo — an exit is not an
    // offer, and a third indigo button would read as a third thing being sold.
    function buildCtaRow(copy, isEntitled, links, onDismiss) {
      var row = el("div", "ctas");
      row.appendChild(makeCta(
        isEntitled ? copy.memberCta : copy.anonCta,
        links.cta,
        "yodev-beta-splash__cta--primary",
        onDismiss
      ));
      row.appendChild(makeCta(copy.learnMore, links.learn, "yodev-beta-splash__cta--learn", onDismiss));
      row.appendChild(makeContinueButton(
        copy.continueCommunity,
        "yodev-beta-splash__cta yodev-beta-splash__cta--continue",
        onDismiss
      ));
      return row;
    }

    // ── 3. Workplace marquee — heading centred with the pill on its own line
    // under it (MarqueeRow centerTitle), sub left, screenshot right.
    function buildWorkplaceRow(home) {
      var row = el("section", "row");
      var text = el("div", "row-text");
      var h = el("h3", "row-title yodev-beta-splash__row-title--center");
      h.appendChild(document.createTextNode(home.wpLead + " "));
      h.appendChild(buildRotatingPill(home.wpWords));
      text.appendChild(h);
      text.appendChild(el("p", "row-sub", home.wpSub));
      row.appendChild(text);

      var media = el("div", "row-media");
      media.appendChild(buildShot(
        readCssVarString("--yodev-beta-img-marquee"),
        "yoDEV Workplace",
        { chrome: true }
      ));
      row.appendChild(media);
      return row;
    }

    // ── 4. worX marquee — heading, sub, "Start on worX", milestones screenshot.
    function buildWorxRow(home, links, onDismiss) {
      var row = el("section", "row");
      var text = el("div", "row-text");
      text.appendChild(el("h3", "row-title", home.worxTitle));
      text.appendChild(el("p", "row-sub", home.worxSub));
      var ctaWrap = el("div", "row-cta");
      ctaWrap.appendChild(makeCta(home.worxCta, links.worx, "yodev-beta-splash__cta--caps", onDismiss));
      text.appendChild(ctaWrap);
      row.appendChild(text);

      var media = el("div", "row-media");
      media.appendChild(buildShot(
        readCssVarString("--yodev-beta-img-worx"),
        "worX billing terms and milestone assistant",
        { fade: true }
      ));
      row.appendChild(media);
      return row;
    }

    // ── 5. Pricing — the single-plan card from Pricing.tsx. Limits live in
    // the feature names; there is no separate value column.
    function buildPricing(home, isEntitled, links, onDismiss) {
      var sec = el("section", "pricing");
      var head = el("div", "pricing-head");
      head.appendChild(el("h3", "pricing-title", home.priceTitle));
      head.appendChild(el("p", "pricing-sub", home.priceSub));
      sec.appendChild(head);

      var plan = el("div", "plan");
      var planHead = el("div", "plan-head");
      var planId = el("div", "plan-id");
      planId.appendChild(el("h4", "plan-name", home.planName));
      planId.appendChild(el("p", "plan-tagline", home.planTagline));
      planHead.appendChild(planId);

      var planCtas = el("div", "plan-ctas");
      if (isEntitled) {
        // Members: the homepage's "Open Workplace" / "Open worX" pair.
        [
          { name: "Workplace", href: WORKPLACE_URL },
          { name: "worX", href: links.worx },
        ].forEach(function (app) {
          var a = makeCta(
            home.openApp.replace("{app}", app.name),
            app.href,
            "yodev-beta-splash__cta--caps yodev-beta-splash__cta--secondary",
            onDismiss
          );
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          planCtas.appendChild(a);
        });
      } else {
        planCtas.appendChild(makeCta(home.planCta, links.cta, "yodev-beta-splash__cta--caps", onDismiss));
      }
      planHead.appendChild(planCtas);
      plan.appendChild(planHead);

      var cols = el("div", "plan-cols");
      home.groups.forEach(function (g) {
        var col = el("div", "plan-col");
        col.appendChild(el("span", "plan-section", g.section));
        var ul = el("ul", "plan-list");
        g.rows.forEach(function (r) {
          var li = el("li", "plan-item");
          var chk = el("span", "check");
          chk.appendChild(svgIcon(ICON_CHECK, 14));
          li.appendChild(chk);
          li.appendChild(el("span", "plan-item-text", r));
          ul.appendChild(li);
        });
        col.appendChild(ul);
        cols.appendChild(col);
      });
      plan.appendChild(cols);
      sec.appendChild(plan);

      // The "*" on "disbursements*" (worX sub + pricing sub) points here.
      sec.appendChild(el("p", "payment-note", home.paymentNote));
      return sec;
    }

    // ── 6. Closing banner — "Ready to build?".
    function buildClosingBanner(copy, isEntitled, links, onDismiss) {
      var banner = el("div", "banner");
      var btext = el("div", "banner-text");
      btext.appendChild(el("h3", "banner-title", copy.splashBannerTitle));
      // Members already have the platform: they get the "jump back in" line,
      // not the sign-up pitch.
      btext.appendChild(el("p", "banner-sub", isEntitled ? copy.splashBannerSubMember : copy.splashBannerSub));
      banner.appendChild(btext);
      var ctas = el("div", "banner-ctas");
      ctas.appendChild(makeCta(
        isEntitled ? copy.memberCta : copy.anonCta,
        links.cta,
        "yodev-beta-splash__cta--primary yodev-beta-splash__cta--banner",
        onDismiss
      ));
      ctas.appendChild(makeCta(
        copy.learnMore,
        links.learn,
        "yodev-beta-splash__cta--learn yodev-beta-splash__cta--banner",
        onDismiss
      ));
      banner.appendChild(ctas);
      return banner;
    }

    // links: { cta, learn, worx } — resolved by init() from the settings.
    function buildSplash(copy, isEntitled, links, onDismiss) {
      var home = SPLASH_HOME[getLocale()] || SPLASH_HOME.es;

      var overlay = document.createElement("div");
      overlay.className = "yodev-beta-splash";
      overlay.setAttribute("role", "dialog");
      overlay.setAttribute("aria-modal", "true");
      overlay.setAttribute("aria-label", "yoDEV");

      var backdrop = el("div", "backdrop");
      backdrop.addEventListener("click", onDismiss, { once: true });

      var card = el("div", "card");
      card.appendChild(el("div", "glow"));

      // The × lives on the card, OUTSIDE the scrolling content, so it stays
      // put however far down the reader has scrolled.
      var dismiss = el("button", "dismiss");
      dismiss.type = "button";
      dismiss.setAttribute("aria-label", "Dismiss");
      dismiss.innerHTML = "&times;";
      dismiss.addEventListener("click", onDismiss, { once: true });
      card.appendChild(dismiss);

      var content = el("div", "content");
      var reveals = [];
      function add(node) { content.appendChild(node); reveals.push(node); }

      add(buildHeader(home));
      add(buildCtaRow(copy, isEntitled, links, onDismiss));
      add(buildWorkplaceRow(home));
      add(buildWorxRow(home, links, onDismiss));
      add(buildPricing(home, isEntitled, links, onDismiss));
      add(buildClosingBanner(copy, isEntitled, links, onDismiss));

      content.appendChild(el("p", "footnote", isEntitled ? copy.splashFootnoteMember : copy.splashFootnote));
      content.appendChild(makeContinueButton(copy.splashContinue, "yodev-beta-splash__continue", onDismiss));

      card.appendChild(content);
      overlay.appendChild(backdrop);
      overlay.appendChild(card);

      // Only the first screenful staggers in; later sections are below the
      // fold and would finish animating before anyone scrolls to them.
      reveals.forEach(function (node, i) {
        node.classList.add("yodev-beta-splash__reveal");
        node.style.animationDelay = 110 + Math.min(i, 3) * 70 + "ms";
      });

      return overlay;
    }

    function insertSplash(splashEl) {
      if (document.querySelector(".yodev-beta-splash")) {
        console.log("[yodev-beta-offer] splash already present; skipping");
        return;
      }
      (document.body || document.documentElement).appendChild(splashEl);
      console.log("[yodev-beta-offer] splash inserted");
    }

    // ─── Poll helper
    // Tries querySelector(selector) every intervalMs until found or timeout.
    // Calls callback(el) with the first match, or callback(null) on timeout.

    function pollFor(selector, timeoutMs, intervalMs, callback) {
      var elapsed = 0;
      var el = document.querySelector(selector);
      if (el) {
        callback(el);
        return;
      }
      var id = setInterval(function () {
        elapsed += intervalMs;
        var found = document.querySelector(selector);
        if (found) {
          clearInterval(id);
          callback(found);
          return;
        }
        if (elapsed >= timeoutMs) {
          clearInterval(id);
          callback(null);
        }
      }, intervalMs);
    }

    // ─── Banner insertion
    // [SELECTOR NOTE] Primary target: #main-outlet (Discourse's standard main
    // content container since at least v2.8; present in v2026.5). The banner
    // is prepended inside it so it appears above all page content.
    // If #main-outlet isn't present (unlikely but possible with heavy theme
    // customisation), we fall back to document.body prepend.
    // To adjust: search DevTools for the outermost content wrapper div.

    function insertBanner(bannerEl) {
      // Guard: don't double-insert (e.g. if init() somehow runs twice)
      if (document.querySelector(".yodev-beta-banner")) {
        console.log("[yodev-beta-offer] banner already present; skipping insert");
        return;
      }

      // [SELECTOR — VERIFY ON REAL DISCOURSE] #main-outlet is the standard
      // wrapper. Some themes or layouts may rename it or add wrapper divs.
      var BANNER_CONTAINER_SELECTOR = "#main-outlet";

      pollFor(BANNER_CONTAINER_SELECTOR, 10000, 200, function (container) {
        if (!container) {
          // Fallback: prepend to body so the banner still shows
          console.warn(
            "[yodev-beta-offer] could not find banner container " +
            BANNER_CONTAINER_SELECTOR +
            " after 10s — falling back to document.body prepend"
          );
          container = document.body;
        }
        // Double-check again in case the interval fired twice
        if (document.querySelector(".yodev-beta-banner")) return;
        container.insertBefore(bannerEl, container.firstChild);
        console.log(
          "[yodev-beta-offer] banner inserted into " +
          (container.id ? "#" + container.id : container.tagName)
        );
      });
    }

    // ─── Signup panel insertion
    // [SELECTOR NOTE] Discourse's signup modal/fullpage uses several containers
    // depending on version and whether it's a modal or a fullpage route:
    //   .create-account            — modal wrapper (most common, v2.8+)
    //   .signup-fullpage           — fullpage signup layout (newer route-based)
    //   .login-fullpage            — same for /login
    //   .d-modal.create-account    — modal variant with Glimmer components
    //   .auth-form                 — inner form in some versions
    // We try a compound selector. If none matches after ~10s, we warn and skip.
    // To adjust: open /signup in DevTools, inspect the first prominent wrapper.

    var SIGNUP_CONTAINER_SELECTOR = [
      ".create-account",
      ".signup-fullpage",
      ".login-fullpage",
      ".d-modal.create-account",
      ".auth-form",
    ].join(", ");

    function insertSignupPanel(panelEl) {
      // Guard double-insert
      if (document.querySelector(".yodev-beta-signup-panel")) {
        console.log("[yodev-beta-offer] signup panel already present; skipping");
        return;
      }

      console.log(
        "[yodev-beta-offer] signup/login page detected — polling for form container"
      );
      console.log(
        "[yodev-beta-offer] trying selectors: " + SIGNUP_CONTAINER_SELECTOR
      );

      // [SELECTOR — VERIFY ON REAL DISCOURSE] See note above.
      pollFor(SIGNUP_CONTAINER_SELECTOR, 10000, 200, function (container) {
        if (!container) {
          console.warn(
            "[yodev-beta-offer] could not find signup form container " +
            "(" + SIGNUP_CONTAINER_SELECTOR + ") after 10s — panel not inserted. " +
            "Check selector against live Discourse DevTools."
          );
          return;
        }
        if (document.querySelector(".yodev-beta-signup-panel")) return;
        container.insertBefore(panelEl, container.firstChild);
        console.log(
          "[yodev-beta-offer] signup panel inserted before " +
          (container.className ? "." + container.className.split(" ")[0] : container.tagName)
        );
      });
    }

    // ─── Main init

    function init() {
      var s = readSettings();
      console.log("[yodev-beta-offer] settings (from CSS vars):", s);

      var locale = getLocale();
      var copy = COPY[locale];
      console.log("[yodev-beta-offer] locale:", locale);

      // Fetch session to determine auth state. We need this before rendering.
      fetch("/session/current.json", { credentials: "same-origin" })
        .then(function (res) {
          if (!res.ok) {
            console.warn(
              "[yodev-beta-offer] /session/current.json status " + res.status +
              " — treating as anonymous"
            );
            return null;
          }
          return res.json();
        })
        .then(function (data) {
          var currentUser = data && data.current_user ? data.current_user : null;
          var isLoggedIn = !!currentUser;
          var username = isLoggedIn ? currentUser.username : null;

          // Entitlement, not just login: a logged-in user only gets the "Business
          // is active" copy if they're actually in the yodev_business group (comp
          // grandfathered members, beta grantees, or paying subscribers all land
          // there). A logged-in but un-granted user (e.g. a fresh signup before the
          // launch grant runs) sees the OFFER, not a false "you already have it".
          // Discourse hands the browser the current user's OWN groups on
          // /session/current.json — no server call, no public field needed.
          // YOD-622 (2026-09-23): one free plan with everything included, so
          // every signed-in member is "entitled" — there is no offer left to
          // sell a logged-in user, only "everything is included".
          var isEntitled = isLoggedIn;

          console.log(
            "[yodev-beta-offer] auth state: " +
              (isLoggedIn
                ? "logged-in (" + username + ")" + (isEntitled ? " · entitled" : " · not-entitled")
                : "anonymous")
          );

          // ── Dismissal check ──────────────────────────────────────────────
          var isDismissed = false;

          if (isLoggedIn && s.dismissedFieldId > 0) {
            // Cross-device dismissal via Discourse User Field
            var fieldKey = "user_field_" + s.dismissedFieldId;
            var fieldVal =
              currentUser.custom_fields &&
              currentUser.custom_fields[fieldKey];
            isDismissed = !!fieldVal;
            if (isDismissed) {
              console.log(
                "[yodev-beta-offer] dismissed (user field " + fieldKey + " = " +
                fieldVal + ")"
              );
            }
          } else {
            // Anonymous or no field configured — check localStorage
            isDismissed = isLocallyDismissed();
            if (isDismissed) {
              console.log("[yodev-beta-offer] dismissed (localStorage)");
            }
          }

          // ── CSRF token (needed for the dismissal PUT) ────────────────────
          var csrfMeta = document.querySelector('meta[name="csrf-token"]');
          var csrfToken = csrfMeta ? csrfMeta.getAttribute("content") : "";

          // ── Decide CTA href ──────────────────────────────────────────────
          var ctaHref;
          // Only an entitled member is routed into the app (marketplaceUrl); a
          // free logged-in user sees the offer, so their CTA points at the homepage.
          if (isEntitled && s.marketplaceUrl) {
            ctaHref = s.marketplaceUrl;
          } else {
            ctaHref = s.ctaUrl || "https://yodev.dev";
          }

          function computeIsAuthPage() {
            var p = window.location.pathname || "";
            return p.indexOf("/signup") === 0 || p.indexOf("/login") === 0;
          }

          /**
           * YOD-564: did this visitor arrive mid-signup from the homepage?
           *
           * They have already read this offer — it is what sent them here.
           * Showing it again, over the create-account modal, sells to someone
           * who is in the act of buying and puts a full-screen overlay between
           * them and the form.
           *
           * computeIsAuthPage() does not catch them: the homepage flow never
           * visits /signup or /login. Discourse renders the create-account
           * modal over `/?yodev_signup=1`, so the pathname is `/`.
           *
           * ⚠️ And they cannot have dismissed it, because they have never been
           * on the community before. That makes this every homepage-first
           * signup, every time — not a stale-localStorage edge case.
           *
           * Two sources, because neither alone covers both journeys:
           *   - the sessionStorage handoff, written by the activation-redirect
           *     component. Authoritative, and the ONLY signal on the email
           *     path, which carries no URL marker.
           *   - the URL marker, as a fallback for the load where that
           *     component has not run yet. Both are head_tag scripts with no
           *     guaranteed order, and it strips the marker as soon as it runs.
           *
           * ⚠️ The key literal is duplicated in
           * discourse-yodev-activation-redirect (HOMEPAGE_SIGNUP_KEY). Theme
           * components cannot share a module; change both together.
           */
          function cameFromHomepageSignup() {
            try {
              if (sessionStorage.getItem("yodev_homepage_signup") === "1") {
                return true;
              }
            } catch (e) {
              // Blocked storage — fall through to the URL checks.
            }
            try {
              var qs = new URLSearchParams(window.location.search);
              if (qs.get("yodev_signup") === "1") return true;
              // ⚠️ On the /auth/<provider> interstitial the marker is not a
              // parameter, it is INSIDE one:
              //   /auth/google_oauth2?origin=%2F%3Fyodev_signup%3D1
              // `origin` is what Discourse will return the visitor to, and it
              // carries the marker as part of its own query string. Reading
              // only top-level params misses this page entirely — which is
              // where the splash was still appearing.
              var origin = qs.get("origin");
              if (origin && origin.indexOf("yodev_signup=1") !== -1) {
                return true;
              }
            } catch (e) {}
            return false;
          }

          /**
           * Pages that are a step IN authenticating, not a place to browse.
           *
           * Suppression here does not depend on where the visitor came from,
           * which is the point: chasing origin markers left holes on exactly
           * the pages that matter most.
           *
           *   /auth/<provider>       the confirm interstitial before the
           *                          provider handshake (YOD-559)
           *   /u/activate-account/   the email verification screen. On the
           *                          email journey nothing has marked this
           *                          browser yet — setActivationFlag() only
           *                          runs when the visitor CLICKS Activate
           *                          Account, which is after this page renders.
           *
           * Nobody on either page wants a full-screen pitch. They are three
           * clicks into acting on one.
           */
          function isAuthJourneyPage() {
            var p = window.location.pathname || "";
            return (
              p.indexOf("/auth/") === 0 ||
              p.indexOf("/u/activate-account") === 0
            );
          }

          // Auth pages get the signup panel instead — see showBanner/showPanel
          // below. Re-derived on every route check, not just here, because
          // Discourse's Ember router changes the path without a page reload.
          var isAuthPage = computeIsAuthPage();
          // Evaluated ONCE, here: the activation-redirect component strips the
          // URL marker during this same page load, so a later re-read could
          // legitimately flip false. The sessionStorage handoff survives, but
          // pinning the value removes the ordering question entirely.
          var midHomepageSignup = cameFromHomepageSignup() || isAuthJourneyPage();
          if (midHomepageSignup) {
            console.log(
              "[yodev-beta-offer] mid-signup from the homepage — suppressing splash and banner (YOD-564)"
            );
          }

          // ── Banner / panel toggle functions ───────────────────────────────
          //
          // v1 shipped as single-evaluation: this decision was made once, at
          // the initial page load, and never revisited. That was fine for a
          // direct hit on /login, but Discourse is an Ember SPA — clicking
          // "Sign Up" from the homepage, or Back from /signup, does NOT reload
          // the page, it's a client-side route transition. The banner built
          // for the ORIGINAL page just sat there, unremoved, because nothing
          // ever told it the route had changed — and the panel never got a
          // chance to insert, because insertSignupPanel only ran once, before
          // the signup form existed to poll for. This is not an edge case: it
          // is the ordinary way most visitors reach /signup (browse the
          // community, then click Sign Up), so it needed fixing before the
          // narrower /login-direct-hit case (YOD-491) was actually complete.
          //
          // Elements are built once and reused — removed/reinserted, not
          // rebuilt — so a dismiss handler wired the first time keeps working
          // on every later toggle.
          var bannerEl = null;
          var panelEl = null;

          function showBannerIfDue() {
            if (isDismissed) return;
            // YOD-564: same reasoning as the splash, one notch less severe —
            // the banner does not block the form, but it still re-pitches an
            // offer this visitor accepted a moment ago on the homepage.
            if (midHomepageSignup) return;
            if (!bannerEl) {
              var bannerParts = {
                tag: isEntitled ? copy.memberTag : copy.tag,
                headline: isEntitled ? copy.memberHeadline : copy.anonHeadline,
                sub: copy.sub,
                member: isEntitled,
                cta: isEntitled ? copy.memberCta : copy.anonCta,
                learnMore: copy.learnMore,
              };
              bannerEl = buildBanner(bannerParts, ctaHref, function () {
                console.log("[yodev-beta-offer] banner dismissed by user");
                setLocallyDismissed();
                // Without this, showBannerIfDue() still reads the isDismissed
                // value captured when the page loaded — so leaving an auth
                // page (which calls showBannerIfDue() again) would resurrect a
                // banner the user just closed. Caught by testing the actual
                // dismiss → navigate round-trip, not just presence/absence.
                isDismissed = true;
                if (isLoggedIn && s.dismissedFieldId > 0) {
                  persistMemberDismissal(username, s.dismissedFieldId, csrfToken);
                }
                if (bannerEl && bannerEl.parentNode) {
                  bannerEl.parentNode.removeChild(bannerEl);
                }
              });
            }
            insertBanner(bannerEl); // no-ops if already in the DOM
          }

          function hideBanner() {
            var el = document.querySelector(".yodev-beta-banner");
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }

          function showPanel() {
            if (!panelEl) panelEl = buildSignupPanel(copy);
            insertSignupPanel(panelEl); // no-ops if already in the DOM
          }

          function hidePanel() {
            var el = document.querySelector(".yodev-beta-signup-panel");
            if (el && el.parentNode) el.parentNode.removeChild(el);
          }

          // ── Initial render ────────────────────────────────────────────────
          if (isAuthPage) {
            showPanel();
          } else {
            showBannerIfDue();
          }

          // ── Splash (full-screen, once-ever, anon + member, any page) ─────
          // Independent of the banner's dismissal. Suppressed on /signup and
          // /login (those already get the panel). splash_enabled gates it.
          // Not re-evaluated on route change: it is a full-screen overlay, so
          // reaching an in-app link to navigate away requires dismissing it
          // first — the stale-state problem the banner/panel have does not
          // arise here.
          // YOD-564: `!midHomepageSignup` — the splash is a full-screen
          // overlay, so on this journey it lands squarely on top of the
          // create-account modal the visitor came to fill in. That makes it
          // the damaging half of this bug, not just the redundant half.
          if (s.splashEnabled && !isAuthPage && !midHomepageSignup) {
            var splashDismissed;
            if (isLoggedIn && s.splashDismissedFieldId > 0) {
              var splashKey = "user_field_" + s.splashDismissedFieldId;
              splashDismissed = !!(
                currentUser.custom_fields &&
                currentUser.custom_fields[splashKey]
              );
            } else {
              splashDismissed = isSplashLocallyDismissed();
            }

            if (splashDismissed) {
              console.log("[yodev-beta-offer] splash already dismissed; skipping");
            } else {
              var splashDone = false;
              function dismissSplash() {
                if (splashDone) return;
                splashDone = true;
                console.log("[yodev-beta-offer] splash dismissed/clicked");
                document.removeEventListener("keydown", onSplashKey);
                setSplashLocallyDismissed();
                if (isLoggedIn && s.splashDismissedFieldId > 0) {
                  persistMemberDismissal(username, s.splashDismissedFieldId, csrfToken);
                }
                if (splashEl && splashEl.parentNode) {
                  splashEl.parentNode.removeChild(splashEl);
                }
              }
              // YOD-516: Escape closes it — the reflex for dismissing a
              // full-screen overlay that covers the article someone came for.
              function onSplashKey(e) {
                if (e.key !== "Escape") return;
                dismissSplash();
              }
              // "Learn more" keeps its existing target (the same href as the
              // primary CTA). "Start on worX" goes to worX itself: the
              // configured marketplace_url, else the worX host.
              var splashLinks = {
                cta: ctaHref,
                learn: ctaHref,
                worx: s.marketplaceUrl || WORX_URL,
              };
              var splashEl = buildSplash(copy, isEntitled, splashLinks, dismissSplash);
              document.addEventListener("keydown", onSplashKey);
              insertSplash(splashEl);
            }
          }

          // ── Re-toggle on Ember SPA navigation ─────────────────────────────
          // Ember's router uses the History API, so wrapping pushState/
          // replaceState plus listening for popstate (back/forward) covers
          // every route change a click or a browser button can produce.
          function onRouteMaybeChanged() {
            var nowAuthPage = computeIsAuthPage();
            if (nowAuthPage === isAuthPage) return; // same surface — nothing to do
            isAuthPage = nowAuthPage;
            if (isAuthPage) {
              hideBanner();
              showPanel();
            } else {
              hidePanel();
              showBannerIfDue();
            }
          }

          ["pushState", "replaceState"].forEach(function (method) {
            var original = history[method];
            history[method] = function () {
              var result = original.apply(this, arguments);
              onRouteMaybeChanged();
              return result;
            };
          });
          window.addEventListener("popstate", onRouteMaybeChanged);
        })
        .catch(function (e) {
          console.warn("[yodev-beta-offer] error fetching session:", e);
          // Graceful degradation: show anonymous banner if session fetch fails
          var locale2 = getLocale();
          var copy2 = COPY[locale2];
          var s2 = readSettings();
          var ctaHref2 = s2.ctaUrl || "https://yodev.dev";
          // YOD-491: this .catch() runs in its own scope, so it needs its own
          // auth-page check rather than reusing isAuthPage from the try block.
          var path2 = window.location.pathname || "";
          var isAuthPage2 = path2.indexOf("/signup") === 0 || path2.indexOf("/login") === 0;

          if (!isLocallyDismissed() && !isAuthPage2) {
            var bannerEl2 = buildBanner(
              { tag: copy2.tag, headline: copy2.anonHeadline, sub: copy2.sub, member: false, cta: copy2.anonCta, learnMore: copy2.learnMore },
              ctaHref2,
              function () {
                setLocallyDismissed();
                console.log("[yodev-beta-offer] banner dismissed (fallback mode)");
              }
            );
            insertBanner(bannerEl2);
          }
        });
    }

    // Run after DOM is available (head_tag runs early, so guard readyState)
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
