en:
  theme_metadata:
    description: "Site-wide auth-aware launch-offer surfaces: a dismissable top banner, a signup-page panel, and an optional one-time full-screen splash (anon + members). Promotes the single free plan (two apps, one plan, everything included); anonymous visitors see "Start now", logged-in members see "everything is included", plus the "Find me on yoDEV worX" LinkedIn banner nudge. Dismissals persist cross-device for members via user fields."
